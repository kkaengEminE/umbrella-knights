<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>숲의 잔향 · 몬스터 제작실</title><style>body{margin:32px auto;max-width:960px;background:#101c27;color:#dfebdf;font:16px system-ui;padding:16px}canvas{width:100%;image-rendering:pixelated;background:#263c43}select,button,a{background:#304d58;color:white;padding:12px;border:1px solid #688590;margin:8px}p{line-height:1.7}</style><h1>숲의 잔향 · 몬스터 제작실</h1><p>일반 잔향과 종탑 파수꾼 · 각각 6개 자세를 재사용합니다.</p><label>동작 <select id="action"><option value="idle">대기</option><option value="walk">이동</option><option value="wind">공격 준비</option><option value="swing">공격</option><option value="hit">피격</option><option value="death">소멸</option></select></label><button id="flip">좌우 반전</button><a href="./">게임으로</a><canvas id="preview" width="960" height="400" aria-label="일반 몬스터와 보스 동작 미리보기"></canvas><p>공격 준비 뒤에 타격이 발생하고, 몸에 닿기만 해서는 피해를 입지 않습니다. 두 번째·세 번째 지역의 전용 원화는 후속 작업입니다.</p><script src="pixel-world.js?v=forest13"></script><script>
let face=1;document.querySelector('#flip').onclick=()=>face*=-1;const c=document.querySelector('canvas'),ctx=c.getContext('2d');function frame(t){ctx.clearRect(0,0,960,400);ctx.fillStyle='#496663';ctx.fillRect(0,330,960,2);const action=document.querySelector('select').value;for(let i=0;i<2;i++){const e={x:280+i*400,y:330,hp:100,max:100,boss:!!i,face,phase:t/1000,type:0,hit:action==='hit'?.2:0,slow:0,wind:action==='wind'?.5:0,swing:action==='swing'?.2:0,moving:action==='walk'};if(action==='death')PixelWorld.death(ctx,{...e,life:.45-(t%900)/2000},0);else PixelWorld.monster(ctx,e,0,t/1000,0)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
